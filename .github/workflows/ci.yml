name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SpellCards.sln

      - name: Build
        run: dotnet build SpellCards.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SpellCards.sln --configuration Release --no-build --verbosity normal
